name: Deploy dashboard

# Publishes web/ (admin dashboard + public settings pages) to the Cloudflare
# Pages project that backs translate.sean8.com. The bot itself is deployed
# separately (git pull + restart on the VPS).

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/build-web.sh'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

concurrency:
  group: deploy-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build web-dist
        run: ./scripts/build-web.sh
        env:
          API_BASE: https://translate-api.sean8.com

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web-dist --project-name=ninja-translate-dashboard --branch=main
